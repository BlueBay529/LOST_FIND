<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>전체 습득물 정보 | 찾아드림</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:#172554;background:#f8fafc}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}header{height:66px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;position:sticky;top:0;z-index:10}.nav{display:flex;align-items:center;justify-content:space-between}.brand{border:0;background:none;color:#172554;font-size:1.2rem;font-weight:900;cursor:pointer}.back{border:1px solid #dbe4f0;background:#fff;color:#334155;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}main{padding:36px 0 70px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.head h1{margin:0;font-size:2rem}.head p{margin:6px 0 0;color:#64748b}.updated{display:block;margin-top:5px;color:#94a3b8;font-size:.82rem}.refresh{border:0;background:#2563eb;color:#fff;border-radius:11px;padding:11px 17px;font-weight:800;cursor:pointer}.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:15px;margin-bottom:18px}.toolbar input,.toolbar select{height:46px;border:1px solid #dbe4f0;border-radius:10px;background:#fff;padding:0 13px;color:#334155}.count{margin:0 0 12px;color:#64748b;font-size:.88rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;width:100%;background:#fff;border:1px solid #dbe7f5;border-radius:15px;padding:17px;box-shadow:0 4px 15px rgba(30,64,175,.04)}.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}.icon{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#eff6ff;color:#2563eb;display:grid;place-items:center}.title{min-width:0;flex:1}.title h2{font-size:1rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small,.source{color:#64748b;font-size:.74rem}.status{flex-shrink:0;white-space:nowrap;border-radius:999px;padding:4px 8px;background:#ecfdf5;color:#047857;font-size:.72rem;font-weight:800}.status.resolved{background:#f1f5f9;color:#64748b}.info{display:grid;gap:7px;margin:0}.row{display:grid;grid-template-columns:70px 1fr;gap:8px;font-size:.82rem}.row dt{color:#94a3b8}.row dd{margin:0;color:#334155;overflow-wrap:anywhere}.source{display:block;margin-top:11px;padding-top:10px;border-top:1px solid #eef2f7}.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #bfdbfe;border-radius:15px;padding:48px 20px;color:#64748b}.empty strong{display:block;color:#1e3a8a;margin-bottom:6px}.loading{grid-column:1/-1;text-align:center;padding:55px;color:#64748b}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:600px){.wrap{width:calc(100% - 24px)}main{padding-top:24px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:1.55rem}.refresh{width:100%}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.grid{grid-template-columns:minmax(0,1fr)}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><button class="brand" id="homeBtn">▣ 찾아드림</button><button class="back" id="backBtn">← 메인으로</button></div></header>
  <main class="wrap">
    <div class="head"><div><h1>전체 습득물 정보</h1><p>서울 열린데이터광장과 LOST112 자료를 함께 확인하세요.</p><small class="updated" id="updatedAt">저장된 정보를 확인하는 중입니다.</small></div><button class="refresh" id="refreshBtn">정보 새로고침 ↻</button></div>
    <div class="toolbar"><input id="search" type="search" placeholder="물품명, 보관장소 또는 관리번호 검색"><select id="category"><option value="all">전체 분류</option><option value="지갑">지갑</option><option value="휴대폰">휴대폰</option><option value="가방">가방</option><option value="열쇠">열쇠</option><option value="기타">기타</option></select><select id="status"><option value="all">전체 상태</option><option value="active">보관 중</option><option value="resolved">주인이 찾아간 물품</option></select></div>
    <p class="count" id="count">조회 중</p><section class="grid" id="grid"><div class="loading">습득물 정보를 불러오는 중입니다.</div></section>
  </main>
  <script>
    const grid=document.querySelector('#grid');
    let items=[];
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const resolved=item=>['수령','반환','인계','완료'].some(word=>String(item.status||'').includes(word));
    const categoryOf=item=>{const value=String(item.itemCategory||item.itemName||'');if(value.includes('지갑')||value.includes('카드'))return'지갑';if(value.includes('휴대폰')||value.includes('핸드폰'))return'휴대폰';if(value.includes('가방'))return'가방';if(value.includes('열쇠')||value.includes('키'))return'열쇠';return'기타'};
    function render(){const query=document.querySelector('#search').value.trim().toLowerCase();const category=document.querySelector('#category').value;const status=document.querySelector('#status').value;const filtered=items.filter(item=>{const text=[item.itemName,item.itemCategory,item.storagePlace,item.receivingOrganization,item.id].filter(Boolean).join(' ').toLowerCase();return(!query||text.includes(query))&&(category==='all'||categoryOf(item)===category)&&(status==='all'||(status==='resolved')===resolved(item))});document.querySelector('#count').textContent=`총 ${filtered.length}건`;if(!filtered.length){grid.innerHTML='<div class="empty"><strong>조건에 맞는 물품이 없습니다.</strong>검색어나 필터를 변경해 보세요.</div>';return}grid.innerHTML=filtered.map(item=>`<article class="card"><div class="card-head"><span class="icon">◇</span><div class="title"><h2>${escapeHtml(item.itemName||'물품명 미상')}</h2><small>${escapeHtml(item.itemCategory||'기타')}</small></div><span class="status ${resolved(item)?'resolved':''}">${escapeHtml(item.status||'보관 중')}</span></div><dl class="info"><div class="row"><dt>관리번호</dt><dd>${escapeHtml(item.id||'정보 없음')}</dd></div><div class="row"><dt>등록일</dt><dd>${escapeHtml(item.registeredDate||'정보 없음')}</dd></div><div class="row"><dt>보관장소</dt><dd>${escapeHtml(item.storagePlace||'정보 없음')}</dd></div><div class="row"><dt>보관기관</dt><dd>${escapeHtml(item.receivingOrganization||'정보 없음')}</dd></div></dl><small class="source">출처: ${escapeHtml(item.source||'공공데이터')}</small></article>`).join('')}
    let publicItemsRetryTimer; async function load(force=false){clearTimeout(publicItemsRetryTimer);const button=document.querySelector('#refreshBtn');button.disabled=true;if(force)grid.innerHTML='<div class="loading">최신 정보를 확인하는 중입니다.</div>';try{const response=await fetch('/api/public-items?start=1&end=50');if(!(response.headers.get('content-type')||'').toLowerCase().includes('json'))throw new Error(`서버에 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요. (응답 코드: ${response.status})`);let result;try{result=await response.json()}catch{throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.')}if(response.ok&&result.loading){grid.innerHTML=`<div class="loading">${escapeHtml(result.message||'정보를 준비 중입니다.')}</div>`;document.querySelector('#count').textContent='정보 준비 중';const retrySeconds=Number.isFinite(result.retryAfterSeconds)?Math.max(3,result.retryAfterSeconds):3;publicItemsRetryTimer=setTimeout(()=>load(),retrySeconds*1000);return}if(!response.ok||!result.success)throw new Error(result.message||'자료를 불러오지 못했습니다.');items=Array.isArray(result.data)?result.data:[];if(result.updatedAt){document.querySelector('#updatedAt').textContent=`최근 업데이트: ${new Date(result.updatedAt).toLocaleString('ko-KR')} · 서버 저장 정보 · 매 정시 갱신`}render()}catch(error){grid.innerHTML=`<div class="empty"><strong>정보를 불러오지 못했습니다.</strong>${escapeHtml(error.message)}</div>`;document.querySelector('#count').textContent='조회 실패'}finally{button.disabled=false}}
    document.querySelector('#homeBtn').onclick=document.querySelector('#backBtn').onclick=()=>location.href='/';
    document.querySelector('#refreshBtn').onclick=()=>load(true);
    document.querySelector('#search').addEventListener('input',render);document.querySelector('#category').addEventListener('change',render);document.querySelector('#status').addEventListener('change',render);
    load(false);
  </script>
</body>
</html>
